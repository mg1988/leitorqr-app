name: LeitorQR

options:
  bundleIdPrefix: com.mg
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  postGenCommand: python3 scripts/fix_scheme.py

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # 命令行出包可用 scripts/release.sh，Team ID 通过环境变量 LEITORQR_TEAM_ID 注入；
    # 或直接把 Team ID 填在这里（引号内）。
    DEVELOPMENT_TEAM: ""
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  LeitorQR:
    type: application
    platform: iOS
    sources:
      - path: LeitorQR
    settings:
      base:
        INFOPLIST_FILE: Support/Info.plist
        # 「扫码连 Wi-Fi」依赖 Hotspot Configuration capability（已启用，需付费开发者账号
        # 在 ASC 为 com.mg.localicard 开启该 capability）。若要临时回到无 capability 的
        # 自签名调试，改回 Support/LeitorQR.entitlements 再 xcodegen generate。
        CODE_SIGN_ENTITLEMENTS: Support/LeitorQR-Hotspot.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mg.localicard
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": U4AF57UZM2
        PRODUCT_NAME: LeitorQR
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

schemes:
  LeitorQR:
    build:
      targets:
        LeitorQR: all
    run:
      config: Debug
      storeKitConfiguration: Support/Products.storekit
    archive:
      config: Release
